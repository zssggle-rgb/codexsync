[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codexsync"
version = "1.0.0"
description = "Seamlessly switch Codex model providers without losing session history."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "zssggle-rgb" },
]
keywords = [
    "codex",
    "openai",
    "deepseek",
    "session",
    "provider-switch",
    "llm",
    "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Tools",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/zssggle-rgb/codexsync"
Repository = "https://github.com/zssggle-rgb/codexsync"
Issues = "https://github.com/zssggle-rgb/codexsync/issues"
Changelog = "https://github.com/zssggle-rgb/codexsync/blob/main/CHANGELOG.md"

[project.scripts]
codexsync = "codexsync.cli:main"

[tool.setuptools.packages.find]
include = ["codexsync*"]

[tool.ruff]
line-length = 100
target-version = "py39"
